<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hand Tracking AR</title>
    
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #050510;
            --text-color: #ffffff;
            --glass-bg: rgba(20, 25, 40, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(16px);
            --accent: #00ffcc;
        }

        * {
            margin: 0;
            padding: 0; 
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .video-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 0; /* Let the raw camera sit behind */
            filter: brightness(0.6) contrast(1.1); /* Subtle dark to make neon pop */
        }

        /* 
         * Background Canvas captures the video frame and applies the matrix rain/starfield 
         */
        #bgCanvas, #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
        }
        
        #bgCanvas {
            z-index: 1;
            pointer-events: none;
        }

        #mainCanvas {
            z-index: 5;
            pointer-events: none;
            /* We use mix-blend-mode for the glowing effects in canvas */
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            min-width: 180px;
        }
        .stat:last-child { margin-bottom: 0; }
        .stat span.val { font-weight: bold; color: var(--accent); }

        /* Themes */
        #themes {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px;
            transition: opacity 0.5s;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 500;
        }
        
        .theme-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            text-shadow: 0 0 10px white;
        }

        /* Start Overlay */
        #startOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: none;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Start Overlay (Required for AudioContext initialization) -->
    <div id="startOverlay">
        <h1 style="margin-bottom: 20px; font-weight: 300; letter-spacing: 4px;">NEON AURA AR</h1>
        <p style="margin-bottom: 40px; color: #888;">Grant camera permissions and click to start audio/visual experience</p>
        <button class="start-btn" id="startBtn">Enter Experience</button>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Spread: <span class="val" id="ui-spread">0%</span></div>
        </div>
        <!-- === SUPERPOWERS LAYER: new panel, existing panels above are untouched === -->
        <div class="panel">
            <div class="stat">Superpower: <span class="val" id="ui-power-val">None</span></div>
            <div class="stat" style="margin-bottom:0; font-size:0.75rem; opacity:0.7;">Snap (thumb+middle) to cycle</div>
        </div>
    </div>

    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">Rainbow</button>
        <button class="theme-btn" data-theme="Cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="Lava">Lava</button>
        <button class="theme-btn" data-theme="Ocean">Ocean</button>
        <button class="theme-btn" data-theme="Galaxy">Galaxy</button>
    </div>

<script>
/** 
 * GLOBALS & CONFIG
 */
const videoElement = document.querySelector('.input_video');
const bgCanvas = document.getElementById('bgCanvas');
const mainCanvas = document.getElementById('mainCanvas');
const bgCtx = bgCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();

let currentHands = []; // Latest data from MediaPipe
let handVelocities = 0; // Average hand movement speed

// Theme Config
let currentTheme = 'Rainbow';
const themes = {
    'Rainbow':   (t, index, total) => `hsl(${(t * 100 + index * (360/total)) % 360}, 100%, 60%)`,
    'Cyberpunk': (t, index, total) => (index % 2 === 0) ? '#ff003c' : '#00f0ff',
    'Lava':      (t, index, total) => `hsl(${(10 + (index * 10)) % 40}, 100%, ${50 + Math.sin(t)*10}%)`,
    'Ocean':     (t, index, total) => `hsl(${180 + (index * 20)}, 100%, 60%)`,
    'Galaxy':    (t, index, total) => `hsl(${260 + Math.sin(t*2 + index)*40}, 100%, 65%)`
};

// Physics Engines Data
let particles = [];
let ripples = [];
const FINGER_TIPS = [4, 8, 12, 16, 20];

// Superpowers layer — intentionally separate from the original particles/ripples engine.
// A quick thumb/index pinch and release acts as a visual "finger snap" and cycles powers.
const SUPERPOWERS = [
    { name: 'FIRE', color: '#ff632f' },
    { name: 'LIGHTNING', color: '#a980ff' },
    { name: 'COSMIC', color: '#d58cff' },
    { name: 'ICE', color: '#8eeeff' },
    { name: 'GRAVITY', color: '#a86bff' },
    { name: 'WIND', color: '#6fffff' },
    { name: 'VOID', color: '#7b3cff' },
    { name: 'SOLAR', color: '#ffd84d' }
];
let activeSuperpower = -1;
let superPowerParticles = [];
let snapWasPinching = false;
let snapPinchStartedAt = 0;
let snapCooldownUntil = 0;
let superpowerFlashUntil = 0;

// Matrix Background
let matrixColumns = [];
const fontSize = 16;
let maxColumns = 0;

// Audio Node References
let audioCtx = null;
let humOsc = null;
let humGain = null;

// UI Elements
const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiGesture = document.getElementById('ui-gesture');
const uiSpread = document.getElementById('ui-spread');
const uiPowerVal = document.getElementById('ui-power-val'); // === SUPERPOWERS LAYER ===

/**
 * INITIALIZATION
 */
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    bgCanvas.width = width;
    bgCanvas.height = height;
    mainCanvas.width = width;
    mainCanvas.height = height;
    
    maxColumns = Math.floor(width / fontSize);
    matrixColumns = new Array(maxColumns).fill(1).map(() => Math.random() * height/fontSize);
}
window.addEventListener('resize', resize);
resize();

// UI Theme Switcher
document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTheme = e.target.getAttribute('data-theme');
        document.documentElement.style.setProperty('--accent', themes[currentTheme](0, 1, 1));
    });
});

// Start button triggers AudioContext and hides overlay
document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('themes').classList.remove('hidden');
    initAudio();
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});


/**
 * AUDIO ENGINE
 */
function initAudio() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Continuous Hum
        humOsc = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        
        humOsc.type = 'sine';
        humOsc.frequency.value = 100;
        
        humGain.gain.value = 0; // Mute until hands are seen
        
        humOsc.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc.start();
    } catch(e) {
        console.error("Web Audio API failed", e);
    }
}

function triggerZap() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    // Zap sound profile
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
    
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function updateHum(activeHands) {
    if (!audioCtx || !humGain) return;
    if (activeHands.length < 2) {
        humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        return;
    }

    // Measure distance between index fingers to modulate volume
    const p1 = activeHands[0][8];
    const p2 = activeHands[1][8];
    const dx = p1.x - p2.x;
    const dy = p1.y - p2.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // The closer they are, the higher the pitch and volume
    const targetFreq = 100 + (1 - Math.min(dist, 1)) * 300;
    const targetVolume = 0.05 + (1 - Math.min(dist, 1)) * 0.15;
    
    humOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
    humGain.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.1);
}

/**
 * MATH & STATE LOGIC
 */
function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

// Convert normalized landmark to specific canvas scale (Note: canvas is horizontally flipped)
function mapToCanvas(point) {
    return { x: point.x * width, y: point.y * height };
}

let lastPinchState = [false, false]; // Prevents rapid re-triggering

function detectGestures() {
    if (!currentHands.length) return;
    
    currentHands.forEach((hand, idx) => {
        // Pinch Detection: Thumb (4) and Index (8)
        const thumb = hand[4];
        const index = hand[8];
        const dist = getDist(thumb, index);
        
        const isPinching = dist < 0.05; // 5% of screen screen distance
        
        if (isPinching && !lastPinchState[idx]) {
            const midpoint = {
                x: (thumb.x + index.x) / 2, 
                y: (thumb.y + index.y) / 2
            };
            createShockwave(mapToCanvas(midpoint), themes[currentTheme](time, 1, 1));
            triggerZap();
            uiGesture.innerText = "PINCH !";
        }
        lastPinchState[idx] = isPinching;
    });

    // Spread Percentage roughly estimated by distance from Palm(0) to Index(8) and Pinky(20)
    if (currentHands[0]) {
        const spread = getDist(currentHands[0][8], currentHands[0][20]);
        // Normalizing spread so max is around 100%
        let spreadPct = Math.min(Math.round(spread * 300), 100);
        uiSpread.innerText = spreadPct + '%';
        if (!lastPinchState.includes(true)) {
            uiGesture.innerText = spreadPct > 50 ? "Open Hand" : "Fist";
        }
    }
}

/**
 * EFFECTS & PHYSICS
 */
function createParticles(pos, color, count = 3) {
    for (let i=0; i<count; i++) {
        particles.push({
            x: pos.x,
            y: pos.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function createShockwave(pos, color) {
    ripples.push({
        x: pos.x,
        y: pos.y,
        radius: 0,
        maxRadius: 150 + Math.random() * 100,
        life: 1.0,
        color: color
    });
}

/**
 * SUPERPOWERS
 * These functions only draw onto the existing main canvas. They do not alter
 * MediaPipe, the original gesture system, audio, UI, themes, or physics.
 */
function getPalm(hand) {
    const wrist = mapToCanvas(hand[0]);
    const indexBase = mapToCanvas(hand[5]);
    const pinkyBase = mapToCanvas(hand[17]);
    const middleBase = mapToCanvas(hand[9]);
    const center = {
        x: (wrist.x + indexBase.x + pinkyBase.x + middleBase.x) / 4,
        y: (wrist.y + indexBase.y + pinkyBase.y + middleBase.y) / 4
    };
    const radius = Math.max(28, (Math.hypot(indexBase.x - pinkyBase.x, indexBase.y - pinkyBase.y) +
        Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y)) * 0.42);
    return { center, radius };
}

function addSuperParticle(x, y, color, type) {
    if (superPowerParticles.length > 400) superPowerParticles.shift();
    superPowerParticles.push({
        x, y, color, type,
        vx: (Math.random() - 0.5) * (type === 'fire' ? 2.2 : 1.4),
        vy: type === 'fire' ? -1.5 - Math.random() * 2.4 : (Math.random() - 0.5) * 1.4,
        life: 0.8 + Math.random() * 0.6,
        size: 1 + Math.random() * 3
    });
}

function updateSuperParticles() {
    for (let i = superPowerParticles.length - 1; i >= 0; i--) {
        const p = superPowerParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
            superPowerParticles.splice(i, 1);
            continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.min(p.life, 1);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        if (p.type === 'ice') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x - p.size, p.y); ctx.lineTo(p.x + p.size, p.y);
            ctx.moveTo(p.x, p.y - p.size); ctx.lineTo(p.x, p.y + p.size);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

function drawFirePower(hand) {
    const { center, radius } = getPalm(hand);
    const aura = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius * 2.2);
    aura.addColorStop(0, 'rgba(255,246,196,0.86)');
    aura.addColorStop(0.22, 'rgba(255,137,36,0.60)');
    aura.addColorStop(0.58, 'rgba(245,45,13,0.22)');
    aura.addColorStop(1, 'rgba(245,30,10,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(center.x, center.y, radius * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 24; ctx.shadowColor = '#ff4b19';
    [5, 9, 13, 17].forEach((joint, i) => {
        const tip = mapToCanvas(hand[joint]);
        const sway = Math.sin(time * 7 + i * 1.9) * radius * 0.32;
        ctx.beginPath();
        ctx.moveTo(center.x + (i - 1.5) * radius * 0.25, center.y + radius * 0.34);
        ctx.quadraticCurveTo(center.x + sway, center.y - radius * 0.5, tip.x, tip.y - radius * 0.72);
        ctx.strokeStyle = i % 2 ? '#ffb13b' : '#ff5429';
        ctx.lineWidth = radius * 0.26;
        ctx.lineCap = 'round'; ctx.stroke();
    });
    ctx.restore();
    if (Math.random() > 0.40) addSuperParticle(center.x + (Math.random() - 0.5) * radius * 1.5, center.y + (Math.random() - 0.5) * radius, '#ff9d37', 'fire');
}

function drawLightningPower(hand) {
    const { center, radius } = getPalm(hand);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowBlur = 24; ctx.shadowColor = '#a980ff';
    FINGER_TIPS.forEach((tipIndex, i) => {
        const end = mapToCanvas(hand[tipIndex]);
        ctx.beginPath(); ctx.moveTo(center.x, center.y);
        for (let step = 1; step < 7; step++) {
            const q = step / 7;
            ctx.lineTo(center.x + (end.x - center.x) * q + (Math.random() - 0.5) * radius * 0.42,
                       center.y + (end.y - center.y) * q + (Math.random() - 0.5) * radius * 0.42);
        }
        ctx.lineTo(end.x, end.y);
        ctx.strokeStyle = i % 2 ? '#f1e8ff' : '#9c67ff';
        ctx.lineWidth = 1.5 + Math.random() * 1.5;
        ctx.stroke();
    });
    ctx.fillStyle = 'rgba(170,125,255,0.22)';
    ctx.beginPath(); ctx.arc(center.x, center.y, radius * 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawCosmicPower(hand) {
    const { center, radius } = getPalm(hand);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const nebula = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius * 2.1);
    nebula.addColorStop(0, 'rgba(255,232,255,0.72)');
    nebula.addColorStop(0.26, 'rgba(225,93,255,0.38)');
    nebula.addColorStop(0.65, 'rgba(58,52,255,0.17)');
    nebula.addColorStop(1, 'rgba(25,15,120,0)');
    ctx.fillStyle = nebula; ctx.beginPath(); ctx.arc(center.x, center.y, radius * 2.1, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 18; i++) {
        const a = time * (1.5 + (i % 3) * 0.23) + i * 2.4;
        const orbit = radius * (0.8 + (i % 5) * 0.18);
        const x = center.x + Math.cos(a) * orbit;
        const y = center.y + Math.sin(a) * orbit * 0.52;
        ctx.fillStyle = i % 3 ? '#f4baff' : '#aab4ff';
        ctx.shadowBlur = 12; ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawIcePower(hand) {
    const { center, radius } = getPalm(hand);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const frost = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius * 1.8);
    frost.addColorStop(0, 'rgba(236,255,255,0.80)');
    frost.addColorStop(0.34, 'rgba(95,224,255,0.35)');
    frost.addColorStop(1, 'rgba(67,174,255,0)');
    ctx.fillStyle = frost; ctx.beginPath(); ctx.arc(center.x, center.y, radius * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 12; ctx.shadowColor = '#a5f6ff';
    for (let i = 0; i < 6; i++) {
        const a = time * 0.7 + i * Math.PI / 3;
        const ex = center.x + Math.cos(a) * radius * 1.35;
        const ey = center.y + Math.sin(a) * radius * 1.35;
        ctx.beginPath(); ctx.moveTo(center.x, center.y); ctx.lineTo(ex, ey);
        ctx.moveTo(center.x + Math.cos(a) * radius * 0.6, center.y + Math.sin(a) * radius * 0.6);
        ctx.lineTo(center.x + Math.cos(a + 0.55) * radius * 0.9, center.y + Math.sin(a + 0.55) * radius * 0.9);
        ctx.strokeStyle = 'rgba(211,252,255,0.82)'; ctx.lineWidth = 1.1; ctx.stroke();
    }
    ctx.restore();
    if (Math.random() > 0.5) addSuperParticle(center.x + (Math.random() - 0.5) * radius * 2, center.y + (Math.random() - 0.5) * radius * 2, '#c7fbff', 'ice');
}

function drawGravityPower(hand) {
    const { center, radius } = getPalm(hand);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let ring = 0; ring < 4; ring++) {
        const spin = time * (1.8 + ring * 0.45) * (ring % 2 ? -1 : 1);
        ctx.beginPath();
        for (let j = 0; j <= 50; j++) {
            const a = spin + j * Math.PI * 2 / 50;
            const r = radius * (0.55 + ring * 0.27 + Math.sin(j * 0.52 + time * 4) * 0.06);
            const x = center.x + Math.cos(a) * r;
            const y = center.y + Math.sin(a) * r * 0.48;
            j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = ring % 2 ? 'rgba(214,160,255,0.54)' : 'rgba(90,98,255,0.58)';
        ctx.lineWidth = 1.2 + ring * 0.25; ctx.shadowBlur = 16; ctx.shadowColor = '#ac6eff'; ctx.stroke();
    }
    ctx.fillStyle = 'rgba(15,7,42,0.68)'; ctx.beginPath(); ctx.arc(center.x, center.y, radius * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawWindPower(hand) {
    const { center, radius } = getPalm(hand);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Wind aura
    const windAura = ctx.createRadialGradient(
        center.x, center.y, 0,
        center.x, center.y, radius * 2.2
    );

    windAura.addColorStop(0, 'rgba(210,255,255,0.45)');
    windAura.addColorStop(0.45, 'rgba(80,240,255,0.20)');
    windAura.addColorStop(1, 'rgba(40,180,255,0)');

    ctx.fillStyle = windAura;
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Swirling wind rings
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#6fffff';

    for (let ring = 0; ring < 4; ring++) {
        ctx.beginPath();

        const rotation = time * (1.8 + ring * 0.35);

        for (let j = 0; j <= 40; j++) {
            const a = rotation + j * Math.PI * 2 / 40;
            const r = radius * (0.65 + ring * 0.25);

            const x = center.x + Math.cos(a) * r;
            const y = center.y + Math.sin(a) * r * 0.45;

            j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }

        ctx.strokeStyle = `rgba(110,255,255,${0.45 - ring * 0.07})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Wind trails from fingertips
    FINGER_TIPS.forEach((tipIndex, i) => {
        const tip = mapToCanvas(hand[tipIndex]);

        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);

        const trail = radius * (1.2 + Math.sin(time * 4 + i) * 0.25);

        ctx.quadraticCurveTo(
            tip.x + Math.sin(time * 5 + i) * radius,
            tip.y - trail * 0.5,
            tip.x + Math.cos(time * 3 + i) * trail,
            tip.y - Math.sin(time * 3 + i) * trail
        );

        ctx.strokeStyle = 'rgba(170,255,255,0.65)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });

    ctx.restore();

    // Wind particles
    if (Math.random() > 0.35) {
        const angle = Math.random() * Math.PI * 2;
        const r = radius * (0.5 + Math.random());

        addSuperParticle(
            center.x + Math.cos(angle) * r,
            center.y + Math.sin(angle) * r,
            '#8fffff',
            'wind'
        );
    }
}

function drawVoidPower(hand) {
    const { center, radius } = getPalm(hand);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Dark void aura
    const voidAura = ctx.createRadialGradient(
        center.x, center.y, 0,
        center.x, center.y, radius * 2.4
    );

    voidAura.addColorStop(0, 'rgba(5,0,20,0.95)');
    voidAura.addColorStop(0.28, 'rgba(60,10,120,0.65)');
    voidAura.addColorStop(0.65, 'rgba(120,30,220,0.20)');
    voidAura.addColorStop(1, 'rgba(80,0,180,0)');

    ctx.fillStyle = voidAura;
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Black hole core
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#7b3cff';

    ctx.fillStyle = '#030008';
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius * 0.42, 0, Math.PI * 2);
    ctx.fill();

    // Purple event horizon
    ctx.strokeStyle = '#a86bff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(
        center.x,
        center.y,
        radius * 0.62 + Math.sin(time * 4) * 4,
        0,
        Math.PI * 2
    );
    ctx.stroke();

    // Rotating gravitational distortion rings
    for (let ring = 0; ring < 3; ring++) {
        ctx.beginPath();

        const rotation = -time * (1.5 + ring * 0.4);

        for (let j = 0; j <= 50; j++) {
            const a = rotation + j * Math.PI * 2 / 50;
            const r = radius * (0.8 + ring * 0.28);

            const x = center.x + Math.cos(a) * r;
            const y = center.y + Math.sin(a) * r * 0.38;

            j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }

        ctx.strokeStyle = `rgba(150,80,255,${0.65 - ring * 0.15})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    // Particle absorption effect
    for (let i = 0; i < 12; i++) {
        const a = time * 1.5 + i * Math.PI / 6;
        const distance = radius * (0.8 + (i % 4) * 0.25);

        const x = center.x + Math.cos(a) * distance;
        const y = center.y + Math.sin(a) * distance * 0.6;

        ctx.beginPath();
        ctx.arc(x, y, 1.5 + (i % 2), 0, Math.PI * 2);
        ctx.fillStyle = '#b98aff';
        ctx.fill();
    }

    ctx.restore();
}

function drawSolarPower(hand) {
    const { center, radius } = getPalm(hand);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Solar glow
    const solarAura = ctx.createRadialGradient(
        center.x, center.y, 0,
        center.x, center.y, radius * 2.5
    );

    solarAura.addColorStop(0, 'rgba(255,255,220,0.95)');
    solarAura.addColorStop(0.20, 'rgba(255,220,70,0.75)');
    solarAura.addColorStop(0.50, 'rgba(255,130,20,0.30)');
    solarAura.addColorStop(1, 'rgba(255,60,0,0)');

    ctx.fillStyle = solarAura;
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Sun core
    ctx.shadowBlur = 35;
    ctx.shadowColor = '#ffd84d';

    const pulse = radius * (0.38 + Math.sin(time * 5) * 0.04);

    ctx.fillStyle = '#fff5b0';
    ctx.beginPath();
    ctx.arc(center.x, center.y, pulse, 0, Math.PI * 2);
    ctx.fill();

    // Solar rays
    for (let i = 0; i < 20; i++) {
        const angle = time * 0.7 + i * Math.PI * 2 / 20;

        const inner = radius * 0.65;
        const outer = radius * (1.1 + Math.sin(time * 4 + i) * 0.25);

        const x1 = center.x + Math.cos(angle) * inner;
        const y1 = center.y + Math.sin(angle) * inner;

        const x2 = center.x + Math.cos(angle) * outer;
        const y2 = center.y + Math.sin(angle) * outer;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = i % 2
            ? 'rgba(255,235,120,0.75)'
            : 'rgba(255,150,30,0.65)';

        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Solar plasma around fingertips
    FINGER_TIPS.forEach((tipIndex, i) => {
        const tip = mapToCanvas(hand[tipIndex]);

        ctx.beginPath();
        ctx.arc(
            tip.x,
            tip.y,
            5 + Math.sin(time * 6 + i) * 2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = '#fff2a0';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff9d24';
        ctx.fill();
    });

    // Orbiting plasma
    for (let i = 0; i < 14; i++) {
        const angle = time * 2 + i * Math.PI * 2 / 14;
        const orbit = radius * (0.75 + (i % 3) * 0.18);

        const x = center.x + Math.cos(angle) * orbit;
        const y = center.y + Math.sin(angle) * orbit * 0.55;

        ctx.beginPath();
        ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2);
        ctx.fillStyle = i % 2 ? '#fff09a' : '#ff9d24';
        ctx.fill();
    }

    ctx.restore();
}

function drawSuperpowers() {
    updateSuperParticles();
    if (activeSuperpower < 0 || !currentHands.length) return;
    currentHands.forEach(hand => {
        if (activeSuperpower === 0) drawFirePower(hand);
        if (activeSuperpower === 1) drawLightningPower(hand);
        if (activeSuperpower === 2) drawCosmicPower(hand);
        if (activeSuperpower === 3) drawIcePower(hand);
        if (activeSuperpower === 4) drawGravityPower(hand);
        if (activeSuperpower === 5) drawWindPower(hand);
        if (activeSuperpower === 6) drawVoidPower(hand);
        if (activeSuperpower === 7) drawSolarPower(hand);
    });
    if (performance.now() < superpowerFlashUntil) {
        ctx.save();
        ctx.globalAlpha = (superpowerFlashUntil - performance.now()) / 350;
        ctx.fillStyle = SUPERPOWERS[activeSuperpower].color;
        ctx.font = '600 18px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 18; ctx.shadowColor = ctx.fillStyle;
        ctx.fillText(SUPERPOWERS[activeSuperpower].name, width / 2, height * 0.16);
        ctx.restore();
    }
}

function updateSuperpowerSnap(now) {
    if (!currentHands.length) { snapWasPinching = false; return; }
    const isPinching = currentHands.some(hand => getDist(hand[4], hand[12]) < 0.045);
    if (isPinching && !snapWasPinching) snapPinchStartedAt = now;
    if (!isPinching && snapWasPinching && now - snapPinchStartedAt < 360 && now > snapCooldownUntil) {
        activeSuperpower = (activeSuperpower + 1) % SUPERPOWERS.length;
        uiPowerVal.innerText = SUPERPOWERS[activeSuperpower].name;
        snapCooldownUntil = now + 650;
        superpowerFlashUntil = now + 350;
        const color = SUPERPOWERS[activeSuperpower].color;
        currentHands.forEach(hand => {
            const p = getPalm(hand).center;
            const particleType =
                activeSuperpower === 3 ? 'ice' :
                activeSuperpower === 5 ? 'wind' :
                activeSuperpower === 6 ? 'void' :
                activeSuperpower === 7 ? 'solar' :
                'cosmic';

            for (let i = 0; i < 20; i++) {
                addSuperParticle(p.x, p.y, color, particleType);
            }
        });
    }
    snapWasPinching = isPinching;
}

// Background Effect Engine
function drawBackground() {
    // Use destination-out to fade out the previous frame's drops, leaving a transparent trail
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = `rgba(0, 0, 0, ${0.15 + Math.min(handVelocities*10, 0.5)})`;
    bgCtx.fillRect(0, 0, width, height);
    bgCtx.globalCompositeOperation = 'source-over';

    // Matrix Rain Effect mapping to hand speed
    bgCtx.fillStyle = themes[currentTheme](time, 1, 1);
    bgCtx.font = fontSize + "px monospace";
    
    // Matrix speed boosts when hands move fast
    let speedMult = 1 + (handVelocities * 100);

    for (let i = 0; i < matrixColumns.length; i++) {
        // Only draw randomly to keep it sparse like stars/rain
        if (Math.random() > 0.95) {
            const char = String.fromCharCode(0x30A0 + Math.random() * 96);
            bgCtx.fillText(char, i * fontSize, matrixColumns[i] * fontSize);
        }
        
        matrixColumns[i] += Math.random() * speedMult;
        
        if (matrixColumns[i] * fontSize > height && Math.random() > 0.9) {
            matrixColumns[i] = 0;
        }
    }
}

function updatePhysics() {
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;     // Fade out
        p.vy += 0.1;        // Gravity
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }
    }
    
    // Ripples / Shockwaves
    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.radius += (r.maxRadius - r.radius) * 0.1; // Ease out
        r.life -= 0.03;
        
        if (r.life <= 0) {
            ripples.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.lineWidth = 4 * r.life;
            ctx.globalAlpha = r.life;
            ctx.stroke();
        }
    }
    ctx.globalAlpha = 1.0; // Reset
}

/**
 * MAIN RENDER PIPELINE
 */
function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    // Update FPS Counter
    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        uiFps.innerText = framesThisSecond;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    drawBackground();

    // The main canvas will clear fully each frame since we handle ghosting via bgCanvas 
    // BUT user requested trailing motion blur for fingertips.
    // Instead of clearRect, we fade the main canvas using destination-out to keep it transparent
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, width, height);

    // Enable Screen mode for additive light effects (like neon bloom)
    ctx.globalCompositeOperation = 'screen'; // Creates glowy overlapping effects

    // Render Physics layer
    updatePhysics();

    // Process Hand Logic if present
    if (currentHands.length > 0) {
        
        // 1. Draw Skeleton
        currentHands.forEach((hand, handIndex) => {
            const glowColor = themes[currentTheme](time, handIndex, 2);
            
            // Draw MediaPipe skeleton connectors using custom styles
            drawConnectors(ctx, hand, HAND_CONNECTIONS, {
                color: glowColor,
                lineWidth: 2
            });
            
            // Draw Landmarks with neon bloom
            ctx.shadowBlur = 15;
            ctx.shadowColor = glowColor;
            
            // Only draw fingertips with intense bloom and spawn particles
            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt = mapToCanvas(hand[tipIndex]);
                const tipCol = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                // Generate constant spark particles at fingertips
                if (Math.random() > 0.6) {
                    createParticles(pt, tipCol, 1);
                }
            });
            ctx.shadowBlur = 0; // Reset
        });

        // 2. Cross-Hand Interactions (Lightning & Gradients)
        if (currentHands.length >= 2) {
            const h1 = currentHands[0];
            const h2 = currentHands[1];

            // A. Rainbow Connecting Lines
            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt1 = mapToCanvas(h1[tipIndex]);
                const pt2 = mapToCanvas(h2[tipIndex]);
                const dist = getDist(pt1, pt2);
                
                const col = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                // Lightning electric arc when very close (but not touching)
                if (dist < 150 && Math.random() > 0.5) {
                    // Draw jagged lightning
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    // Midpoint jitter
                    const midX = (pt1.x + pt2.x)/2 + (Math.random() - 0.5) * 50;
                    const midY = (pt1.y + pt2.y)/2 + (Math.random() - 0.5) * 50;
                    ctx.lineTo(midX, midY);
                    ctx.lineTo(pt2.x, pt2.y);
                    
                    ctx.strokeStyle = '#ffffff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = col;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Normal flowing gradient line
                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                
                // Create gradient that shifts over time
                let grad = ctx.createLinearGradient(pt1.x, pt1.y, pt2.x, pt2.y);
                grad.addColorStop(0, themes[currentTheme](time, idx, 5));
                grad.addColorStop(0.5, themes[currentTheme](time, idx + 1, 5));
                grad.addColorStop(1, themes[currentTheme](time, idx + 2, 5));
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 10;
                ctx.shadowColor = col;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // B. Mandala drawing if 10 tips are perfectly detected
            // (Assuming if we have 2 hands, we draw lines connecting all tips in a star)
            if (h1 && h2) {
                // Combine all 10 tips
                let allTips = FINGER_TIPS.map(t => mapToCanvas(h1[t])).concat(
                              FINGER_TIPS.map(t => mapToCanvas(h2[t])) );
                
                ctx.save();
                // Find center point to draw Mandala
                let cx = allTips.reduce((sum, p) => sum + p.x, 0) / 10;
                let cy = allTips.reduce((sum, p) => sum + p.y, 0) / 10;
                
                ctx.translate(cx, cy);
                ctx.rotate(time * 0.5); // Slow rotation
                
                ctx.beginPath();
                for (let i=0; i<10; i++) {
                    const t1 = { x: allTips[i].x - cx, y: allTips[i].y - cy };
                    const t2 = { x: allTips[(i+3)%10].x - cx, y: allTips[(i+3)%10].y - cy };
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                }
                ctx.strokeStyle = `rgba(255, 255, 255, 0.2)`;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }
        }
        
        detectGestures();
    }

    // Additional overlay only: original hand rendering and gestures above remain untouched.
    updateSuperpowerSnap(timestamp);
    drawSuperpowers();
    
    ctx.globalCompositeOperation = 'source-over'; // Restore
}

/**
 * MEDIAPIPE INITIALIZATION
 */
function initMediaPipe() {
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1, 
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        if (!audioCtx) return; // Wait for initialization

        // Update global state for render loop to read from
        uiHands.innerText = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
        
        // Calculate velocity (rudimentary)
        if (currentHands.length > 0 && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            let vSum = 0;
            // check distance difference on index finger of hand 0 
            const oldP = currentHands[0][8];
            const newP = results.multiHandLandmarks[0][8];
            if (oldP && newP) {
                vSum += getDist(oldP, newP);
                handVelocities = vSum; 
            }
        } else {
            handVelocities = 0;
        }

        currentHands = results.multiHandLandmarks || [];
        updateHum(currentHands);
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720,
        facingMode: 'user'
    });
    
    camera.start();
}
